<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6.2 - Card Layout</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

  <div class="container my-4">
    <h2 class="text-center mb-4">Exercise 6.2 - Card Layout</h2>

    <div class="row">

      <!-- Card 1 -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">Card One</h5>
              <p class="card-text">This is some content inside the first card.</p>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="badge bg-primary">New</span>
              <button class="btn btn-sm btn-outline-primary">Read More</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">Card Two</h5>
              <p class="card-text">This is some content inside the second card.</p>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="badge bg-success">Popular</span>
              <button class="btn btn-sm btn-outline-success">Read More</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">Card Three</h5>
              <p class="card-text">This is some content inside the third card.</p>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="badge bg-warning text-dark">Sale</span>
              <button class="btn btn-sm btn-outline-warning">Read More</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 8.1 - Registration Form</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow">
          <div class="card-body p-4">

            <h2 class="text-center fw-bold mb-4">Registration Form</h2>

            <!-- FULL NAME -->
            <div class="mb-3">
              <label for="fullname" class="form-label fw-bold">Full Name</label>
              <input type="text" class="form-control" 
                     id="fullname" placeholder="Enter your full name">
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
              <label for="email" class="form-label fw-bold">Email Address</label>
              <input type="email" class="form-control" 
                     id="email" placeholder="Enter your email">
            </div>

            <!-- PASSWORD with input-group -->
            <div class="mb-3">
              <label for="password" class="form-label fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text">🔒</span>
                <input type="password" class="form-control" 
                       id="password" placeholder="Enter your password">
              </div>
            </div>

            <!-- CONFIRM PASSWORD with input-group -->
            <div class="mb-3">
              <label for="confirmpassword" class="form-label fw-bold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text">🔒</span>
                <input type="password" class="form-control" 
                       id="confirmpassword" placeholder="Confirm your password">
              </div>
            </div>

            <!-- PHONE NUMBER with input-group -->
            <div class="mb-3">
              <label for="phone" class="form-label fw-bold">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text">+91</span>
                <input type="tel" class="form-control" 
                       id="phone" placeholder="Enter your phone number">
              </div>
            </div>

            <!-- GENDER -->
            <div class="mb-3">
              <label class="form-label fw-bold">Gender</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" 
                       name="gender" id="male">
                <label class="form-check-label" for="male">Male</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" 
                       name="gender" id="female">
                <label class="form-check-label" for="female">Female</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" 
                       name="gender" id="other">
                <label class="form-check-label" for="other">Other</label>
              </div>
            </div>

            <!-- INTERESTS -->
            <div class="mb-3">
              <label class="form-label fw-bold">Interests</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="sports">
                <label class="form-check-label" for="sports">Sports</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="music">
                <label class="form-check-label" for="music">Music</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="travel">
                <label class="form-check-label" for="travel">Travel</label>
              </div>
            </div>

            <!-- COUNTRY SELECT -->
            <div class="mb-3">
              <label for="country" class="form-label fw-bold">Country</label>
              <select class="form-control" id="country">
                <option value="">-- Select Country --</option>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
                <option>Canada</option>
                <option>Australia</option>
              </select>
            </div>

            <!-- TERMS & CONDITIONS -->
            <div class="mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" for="terms">
                  I agree to the <a href="#">Terms and Conditions</a>
                </label>
              </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Register Now
              </button>
            </div>

            <p class="text-center mt-3 text-muted">
              Already have an account? <a href="#">Login here</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Local Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <title>Bootstrap Local Files Demo</title>
</head>
<body>

    <div class="container mt-5">

        <h1 class="text-primary">
            Bootstrap Using Downloaded Files
        </h1>

        <p class="lead">
            This page uses Bootstrap files stored locally in the project.
        </p>

        <div class="card shadow-sm" style="width: 22rem;">
            <div class="card-body">
                <h5 class="card-title">Sample Card</h5>
                <p class="card-text">
                    Bootstrap styles are loaded from downloaded files.
                </p>
                <button class="btn btn-success">
                    Click Here
                </button>
            </div>
        </div>

    </div>

    <!-- Local Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>

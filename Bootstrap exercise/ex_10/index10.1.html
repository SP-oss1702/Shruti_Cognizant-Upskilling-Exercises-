<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 10.1 - Responsive Navbar</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <!-- LOGO -->
      <a class="navbar-brand fw-bold fs-4" href="#">
        🌐 MyWebsite
      </a>

      <!-- HAMBURGER TOGGLE (mobile) -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- NAV LINKS + SEARCH -->
      <div class="collapse navbar-collapse" id="navbarMain">

        <!-- LEFT LINKS -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Services</a>
          </li>

          <!-- DROPDOWN -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#"
               data-bs-toggle="dropdown">Pages</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Portfolio</a></li>
              <li><a class="dropdown-item" href="#">Blog</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#">FAQ</a></li>
            </ul>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>

        <!-- SEARCH FORM -->
        <form class="d-flex gap-2">
          <input class="form-control" type="search"
                 placeholder="Search...">
          <button class="btn btn-outline-light" type="submit">
            Search
          </button>
        </form>

      </div>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  <div class="container my-5">
    <h2 class="text-center fw-bold">Welcome to Exercise 10.1</h2>
    <p class="text-center text-muted lead">
      Resize the browser window to see the hamburger menu on mobile!
    </p>

    <div class="alert alert-info text-center mt-4">
      🔍 The navbar includes a <strong>Logo</strong>, 
      <strong>Navigation Links</strong>, a <strong>Dropdown</strong>, 
      and a <strong>Search Form</strong>!
    </div>
  </div>

  <script src="js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.2 - Four Column Layout</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

  <div class="container">
    <h2 class="text-center my-4">Four Column Layout (col-sm-3)</h2>

    <div class="row">
      <div class="col-sm-3" style="background-color: #f0f0f0; border: 1px solid #ccc; padding: 20px;">
        <h4>Column 1</h4>
        <p>This is the first column content.</p>
      </div>

      <div class="col-sm-3" style="background-color: #d9edf7; border: 1px solid #ccc; padding: 20px;">
        <h4>Column 2</h4>
        <p>This is the second column content.</p>
      </div>

      <div class="col-sm-3" style="background-color: #dff0d8; border: 1px solid #ccc; padding: 20px;">
        <h4>Column 3</h4>
        <p>This is the third column content.</p>
      </div>

      <div class="col-sm-3" style="background-color: #fcf8e3; border: 1px solid #ccc; padding: 20px;">
        <h4>Column 4</h4>
        <p>This is the fourth column content.</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 8.2 - Login Form with Floating Labels</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">

        <div class="card shadow">
          <div class="card-body p-4">

            <h2 class="text-center fw-bold mb-4">Login</h2>

            <!-- FLOATING EMAIL -->
            <div class="form-floating mb-3">
              <input type="email" class="form-control" 
                     id="floatingEmail" placeholder="name@example.com">
              <label for="floatingEmail">Email Address</label>
            </div>

            <!-- FLOATING PASSWORD -->
            <div class="form-floating mb-3">
              <input type="password" class="form-control" 
                     id="floatingPassword" placeholder="Password">
              <label for="floatingPassword">Password</label>
            </div>

            <!-- FLOATING SELECT -->
            <div class="form-floating mb-3">
              <select class="form-select" id="floatingRole">
                <option value="">-- Select Role --</option>
                <option>Admin</option>
                <option>User</option>
                <option>Guest</option>
              </select>
              <label for="floatingRole">Login As</label>
            </div>

            <!-- REMEMBER ME -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">
                Remember Me
              </label>
            </div>

            <!-- LOGIN BUTTON -->
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary btn-lg">
                Login
              </button>
            </div>

            <!-- FORGOT PASSWORD -->
            <p class="text-center">
              <a href="#" class="text-decoration-none">Forgot Password?</a>
            </p>

            <hr>

            <!-- REGISTER LINK -->
            <p class="text-center text-muted mb-0">
              Don't have an account? 
              <a href="#" class="text-decoration-none fw-bold">Register here</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 9.1 - Bootstrap Buttons</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

  <div class="container my-5">
    <h2 class="text-center fw-bold mb-5">Exercise 9.1 - Bootstrap Buttons</h2>

    <!-- SOLID BUTTONS -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="fw-bold text-primary mb-3">Solid Buttons</h5>
        <button class="btn btn-primary me-2 mb-2">btn-primary</button>
        <button class="btn btn-secondary me-2 mb-2">btn-secondary</button>
        <button class="btn btn-success me-2 mb-2">btn-success</button>
        <button class="btn btn-danger me-2 mb-2">btn-danger</button>
        <button class="btn btn-warning me-2 mb-2">btn-warning</button>
        <button class="btn btn-info me-2 mb-2">btn-info</button>
        <button class="btn btn-light me-2 mb-2">btn-light</button>
        <button class="btn btn-dark me-2 mb-2">btn-dark</button>
      </div>
    </div>

    <!-- OUTLINE BUTTONS -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="fw-bold text-success mb-3">Outline Buttons</h5>
        <button class="btn btn-outline-primary me-2 mb-2">btn-outline-primary</button>
        <button class="btn btn-outline-secondary me-2 mb-2">btn-outline-secondary</button>
        <button class="btn btn-outline-success me-2 mb-2">btn-outline-success</button>
        <button class="btn btn-outline-danger me-2 mb-2">btn-outline-danger</button>
        <button class="btn btn-outline-warning me-2 mb-2">btn-outline-warning</button>
        <button class="btn btn-outline-info me-2 mb-2">btn-outline-info</button>
        <button class="btn btn-outline-dark me-2 mb-2">btn-outline-dark</button>
      </div>
    </div>

    <!-- BUTTON SIZES -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="fw-bold text-danger mb-3">Button Sizes</h5>
        <button class="btn btn-primary btn-lg me-2 mb-2">Large btn-lg</button>
        <button class="btn btn-primary me-2 mb-2">Default</button>
        <button class="btn btn-primary btn-sm me-2 mb-2">Small btn-sm</button>
      </div>
    </div>

    <!-- FULL WIDTH BUTTON -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="fw-bold text-warning mb-3">Full Width Button (d-grid)</h5>
        <div class="d-grid mb-2">
          <button class="btn btn-primary btn-lg">Full Width Primary</button>
        </div>
        <div class="d-grid">
          <button class="btn btn-outline-danger btn-lg">Full Width Outline Danger</button>
        </div>
      </div>
    </div>

    <!-- DISABLED BUTTONS -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="fw-bold text-dark mb-3">Disabled Buttons</h5>
        <button class="btn btn-primary me-2 mb-2" disabled>Disabled Primary</button>
        <button class="btn btn-success me-2 mb-2" disabled>Disabled Success</button>
        <button class="btn btn-outline-danger me-2 mb-2" disabled>Disabled Outline</button>
      </div>
    </div>

    <!-- LINK BUTTON -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="fw-bold text-info mb-3">Link & Close Buttons</h5>
        <button class="btn btn-link me-2">btn-link</button>
        <button type="button" class="btn-close me-2"></button>
      </div>
    </div>

  </div>

  <script src="js/bootstrap.min.js"></script>
</body>
</html>

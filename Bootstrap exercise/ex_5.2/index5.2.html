<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5.2 - Reorder Columns</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

  <div class="container my-4">
    <h2 class="text-center mb-4">Exercise 5.2 - Reorder Columns</h2>

    <div class="row">

      <!-- Appears FIRST in HTML but shows SECOND on medium+ screens -->
      <div class="col-md-6 order-md-2" 
           style="background-color: #f9d9d9; border: 1px solid #ccc; padding: 20px; text-align: center;">
        <h4>Column A</h4>
        <p>I am <strong>first</strong> in the HTML code.</p>
        <p>But on medium screens, I appear <strong>second</strong>.</p>
      </div>

      <!-- Appears SECOND in HTML but shows FIRST on medium+ screens -->
      <div class="col-md-6 order-md-1" 
           style="background-color: #d9f9d9; border: 1px solid #ccc; padding: 20px; text-align: center;">
        <h4>Column B</h4>
        <p>I am <strong>second</strong> in the HTML code.</p>
        <p>But on medium screens, I appear <strong>first</strong>.</p>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="js/bootstrap.min.js"></script>
</body>
</html>
